                @click="[main.setColorScheme(colorScheme.value,true),currentValue = colorScheme.value]"
              >
                <span :class="colorScheme.icon"></span>
                <span x-text="colorScheme.label"></span>
              </li>
            </template>
          </ul>
        </li>
